name: pr
on:
  pull_request:
  push: { branches: [main] }

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        # Also the type check: next build fails on type errors here (no
        # ignoreBuildErrors), and it generates the gitignored next-env.d.ts
        # that a standalone tsc run needs.
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit

  # NO TEST STEP: this repo has no tests and no test runner (inventory 01 §4).
  # Stated rather than silently omitted. First test added here should add the
  # step; the lead-capture route in src/app/api/lead/route.ts is the place to
  # start - it is public, unauthenticated, and writes to production.
